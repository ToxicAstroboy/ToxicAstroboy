<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Toxic Astroboy — Dodge!</title>
<style>
  :root {
    --bg: #0b0d1a;
    --fg: #e7f6ff;
    --accent: #6cffae;
    --danger: #ff4d6d;
    --coin: #ffd93d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: "Press Start 2P", ui-monospace, "Courier New", monospace;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 12px;
    touch-action: none;
  }
  #hud {
    width: 100%;
    max-width: 480px;
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  #hud .lives { color: var(--danger); }
  #hud .score { color: var(--accent); }
  #stage {
    position: relative;
    width: min(96vw, 480px);
    aspect-ratio: 3 / 4;
    border: 3px solid #1c2140;
    border-radius: 6px;
    box-shadow: 0 0 0 4px #06070f, 0 12px 32px rgba(0,0,0,0.6);
    background: #11142a;
    overflow: hidden;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    background: rgba(11, 13, 26, 0.85);
    text-align: center;
    padding: 16px;
    z-index: 2;
  }
  #overlay h1 {
    font-size: 18px;
    letter-spacing: 2px;
    color: var(--accent);
  }
  #overlay p { font-size: 10px; line-height: 1.7; opacity: 0.85; }
  #overlay button {
    font: inherit;
    font-size: 12px;
    padding: 12px 20px;
    background: var(--accent);
    color: #06121a;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  #overlay button:active { transform: translateY(1px); }
  #overlay.hidden { display: none; }
  #hint {
    font-size: 9px;
    opacity: 0.55;
    letter-spacing: 1px;
    text-align: center;
  }
</style>
</head>
<body>
  <div id="hud">
    <div class="lives" id="lives">♥ ♥ ♥</div>
    <div class="score" id="score">0000</div>
  </div>

  <div id="stage">
    <canvas id="game" width="120" height="160"></canvas>
    <div id="overlay">
      <h1 id="title">Toxic Astroboy</h1>
      <p id="message">
        Dodge red spikes. Grab yellow coins.<br/>
        Arrow keys / A-D / Touch to move.
      </p>
      <button id="startBtn">Play</button>
    </div>
  </div>

  <div id="hint">Quick respawn • 3 lives • Beat your score</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  const W = canvas.width;
  const H = canvas.height;

  const livesEl = document.getElementById('lives');
  const scoreEl = document.getElementById('score');
  const overlay = document.getElementById('overlay');
  const titleEl = document.getElementById('title');
  const messageEl = document.getElementById('message');
  const startBtn = document.getElementById('startBtn');

  const state = {
    running: false,
    lives: 3,
    score: 0,
    best: parseInt(localStorage.getItem('astroboy_best') || '0', 10),
    player: { x: W / 2 - 5, y: H - 20, w: 10, h: 12, vx: 0, invuln: 0 },
    entities: [],
    stars: [],
    spawnTimer: 0,
    spawnInterval: 38,
    speed: 1.0,
    tick: 0,
    input: { left: false, right: false },
  };

  for (let i = 0; i < 28; i++) {
    state.stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      s: Math.random() < 0.7 ? 0.3 : 0.7,
      b: Math.random() < 0.4 ? 1 : 2,
    });
  }

  function reset(full) {
    state.player.x = W / 2 - 5;
    state.player.vx = 0;
    state.player.invuln = 60;
    state.entities = [];
    state.spawnTimer = 0;
    state.spawnInterval = 38;
    state.speed = 1.0;
    state.tick = 0;
    if (full) {
      state.lives = 3;
      state.score = 0;
    }
    updateHud();
  }

  function updateHud() {
    livesEl.textContent = '♥ '.repeat(Math.max(0, state.lives)).trim() || '—';
    scoreEl.textContent = String(state.score).padStart(4, '0');
  }

  function spawn() {
    const isCoin = Math.random() < 0.32;
    const size = isCoin ? 6 : 8;
    state.entities.push({
      x: Math.random() * (W - size),
      y: -size,
      w: size,
      h: size,
      vy: (isCoin ? 0.9 : 1.1) * state.speed + Math.random() * 0.4,
      kind: isCoin ? 'coin' : 'spike',
      spin: Math.random() * Math.PI * 2,
    });
  }

  function rectsOverlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  function loseLife() {
    state.lives--;
    state.player.invuln = 70;
    state.player.x = W / 2 - 5;
    flash();
    if (state.lives <= 0) {
      gameOver();
    } else {
      updateHud();
    }
  }

  let flashFrames = 0;
  function flash() { flashFrames = 8; }

  function gameOver() {
    state.running = false;
    if (state.score > state.best) {
      state.best = state.score;
      localStorage.setItem('astroboy_best', String(state.best));
    }
    titleEl.textContent = 'Game Over';
    messageEl.innerHTML = `Score: <b>${state.score}</b><br/>Best: <b>${state.best}</b>`;
    startBtn.textContent = 'Again';
    overlay.classList.remove('hidden');
  }

  function start() {
    overlay.classList.add('hidden');
    reset(true);
    state.running = true;
    requestAnimationFrame(loop);
  }

  function update() {
    state.tick++;

    const p = state.player;
    const accel = 0.55;
    const max = 1.9;
    if (state.input.left)  p.vx = Math.max(p.vx - accel, -max);
    else if (state.input.right) p.vx = Math.min(p.vx + accel, max);
    else p.vx *= 0.78;

    p.x += p.vx;
    if (p.x < 1) { p.x = 1; p.vx = 0; }
    if (p.x + p.w > W - 1) { p.x = W - 1 - p.w; p.vx = 0; }

    if (p.invuln > 0) p.invuln--;

    state.spawnTimer++;
    if (state.spawnTimer >= state.spawnInterval) {
      state.spawnTimer = 0;
      spawn();
    }

    if (state.tick % 240 === 0) {
      state.speed = Math.min(state.speed + 0.12, 2.4);
      state.spawnInterval = Math.max(14, state.spawnInterval - 2);
    }

    for (const e of state.entities) {
      e.y += e.vy;
      e.spin += 0.15;
    }

    for (let i = state.entities.length - 1; i >= 0; i--) {
      const e = state.entities[i];
      if (e.y > H + 8) {
        state.entities.splice(i, 1);
        continue;
      }
      if (rectsOverlap(p, e)) {
        if (e.kind === 'coin') {
          state.score += 10;
          state.entities.splice(i, 1);
          updateHud();
        } else if (p.invuln <= 0) {
          state.entities.splice(i, 1);
          loseLife();
        }
      }
    }

    if (state.tick % 6 === 0) {
      state.score += 1;
      updateHud();
    }

    for (const s of state.stars) {
      s.y += s.s * state.speed;
      if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
    }
  }

  function drawPixel(x, y, c) {
    ctx.fillStyle = c;
    ctx.fillRect(x | 0, y | 0, 1, 1);
  }

  function drawPlayer(p) {
    const x = p.x | 0, y = p.y | 0;
    const skin = '#ffd9b3';
    const suit = '#5cc8ff';
    const helmet = '#e7f6ff';
    const visor = '#1b2a55';
    const boot = '#3a4f8a';

    // helmet
    ctx.fillStyle = helmet;
    ctx.fillRect(x + 2, y, 6, 4);
    ctx.fillRect(x + 1, y + 1, 8, 3);
    // visor
    ctx.fillStyle = visor;
    ctx.fillRect(x + 2, y + 2, 6, 2);
    ctx.fillStyle = '#6cffae';
    ctx.fillRect(x + 3, y + 2, 1, 1);
    // body
    ctx.fillStyle = suit;
    ctx.fillRect(x + 2, y + 4, 6, 5);
    // arms
    ctx.fillRect(x + 1, y + 5, 1, 3);
    ctx.fillRect(x + 8, y + 5, 1, 3);
    // belt
    ctx.fillStyle = '#ffd93d';
    ctx.fillRect(x + 2, y + 8, 6, 1);
    // legs
    ctx.fillStyle = boot;
    ctx.fillRect(x + 2, y + 9, 2, 3);
    ctx.fillRect(x + 6, y + 9, 2, 3);
    // thruster flame (animated)
    if ((state.tick >> 1) & 1) {
      ctx.fillStyle = '#ffae3d';
      ctx.fillRect(x + 3, y + 12, 1, 1);
      ctx.fillRect(x + 6, y + 12, 1, 1);
    } else {
      ctx.fillStyle = '#ff4d6d';
      ctx.fillRect(x + 3, y + 12, 1, 1);
      ctx.fillRect(x + 6, y + 12, 1, 1);
    }
  }

  function drawSpike(e) {
    const x = e.x | 0, y = e.y | 0;
    ctx.fillStyle = '#ff4d6d';
    // diamond
    ctx.fillRect(x + 3, y,     2, 1);
    ctx.fillRect(x + 2, y + 1, 4, 1);
    ctx.fillRect(x + 1, y + 2, 6, 1);
    ctx.fillRect(x,     y + 3, 8, 2);
    ctx.fillRect(x + 1, y + 5, 6, 1);
    ctx.fillRect(x + 2, y + 6, 4, 1);
    ctx.fillRect(x + 3, y + 7, 2, 1);
    ctx.fillStyle = '#fff';
    ctx.fillRect(x + 3, y + 3, 1, 1);
  }

  function drawCoin(e) {
    const x = e.x | 0, y = e.y | 0;
    const phase = Math.floor((e.spin / (Math.PI / 2)) % 2);
    ctx.fillStyle = '#ffd93d';
    if (phase === 0) {
      ctx.fillRect(x + 1, y,     4, 1);
      ctx.fillRect(x,     y + 1, 6, 4);
      ctx.fillRect(x + 1, y + 5, 4, 1);
      ctx.fillStyle = '#fff7a8';
      ctx.fillRect(x + 1, y + 1, 1, 3);
    } else {
      ctx.fillRect(x + 2, y,     2, 6);
      ctx.fillStyle = '#fff7a8';
      ctx.fillRect(x + 2, y + 1, 1, 4);
    }
  }

  function render() {
    ctx.fillStyle = '#11142a';
    ctx.fillRect(0, 0, W, H);

    // stars
    for (const s of state.stars) {
      ctx.fillStyle = s.b === 1 ? '#3a4470' : '#7888c4';
      ctx.fillRect(s.x | 0, s.y | 0, 1, 1);
    }

    // ground line
    ctx.fillStyle = '#1c2140';
    ctx.fillRect(0, H - 6, W, 1);
    for (let x = 0; x < W; x += 4) {
      ctx.fillStyle = (x + (state.tick >> 1)) % 8 === 0 ? '#2a335f' : '#1c2140';
      ctx.fillRect(x, H - 5, 2, 1);
    }

    // entities
    for (const e of state.entities) {
      if (e.kind === 'spike') drawSpike(e);
      else drawCoin(e);
    }

    // player (flicker when invulnerable)
    if (!(state.player.invuln > 0 && (state.tick >> 1) & 1)) {
      drawPlayer(state.player);
    }

    // hit flash
    if (flashFrames > 0) {
      ctx.fillStyle = `rgba(255,77,109,${flashFrames / 16})`;
      ctx.fillRect(0, 0, W, H);
      flashFrames--;
    }
  }

  function loop() {
    if (!state.running) { render(); return; }
    update();
    render();
    requestAnimationFrame(loop);
  }

  // input — keyboard
  addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') state.input.left = true;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') state.input.right = true;
    if ((e.key === 'Enter' || e.key === ' ') && !state.running) start();
  });
  addEventListener('keyup', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') state.input.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') state.input.right = false;
  });

  // input — touch / mouse drag on stage
  const stage = document.getElementById('stage');
  function setFromPointer(clientX) {
    const rect = stage.getBoundingClientRect();
    const ratio = (clientX - rect.left) / rect.width;
    const targetX = ratio * W - state.player.w / 2;
    if (targetX < state.player.x - 0.5) { state.input.left = true; state.input.right = false; }
    else if (targetX > state.player.x + 0.5) { state.input.right = true; state.input.left = false; }
    else { state.input.left = false; state.input.right = false; }
  }
  let dragging = false;
  stage.addEventListener('pointerdown', (e) => {
    if (e.target.tagName === 'BUTTON') return;
    dragging = true;
    setFromPointer(e.clientX);
  });
  stage.addEventListener('pointermove', (e) => { if (dragging) setFromPointer(e.clientX); });
  addEventListener('pointerup', () => {
    dragging = false;
    state.input.left = false;
    state.input.right = false;
  });

  startBtn.addEventListener('click', start);

  updateHud();
  render();
})();
</script>
</body>
</html>

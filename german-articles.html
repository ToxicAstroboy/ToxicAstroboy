<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Toxic Astroboy — Der · Die · Das Trainer</title>
<style>
  :root {
    --bg: #0b0d1a;
    --fg: #e7f6ff;
    --accent: #6cffae;
    --danger: #ff4d6d;
    --coin: #ffd93d;
    --der: #5cc8ff;   /* blue  */
    --die: #ff7ab0;   /* pink  */
    --das: #b48cff;   /* purple */
    --panel: #11142a;
    --line: #1c2140;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    min-height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: "Press Start 2P", ui-monospace, "Courier New", monospace;
    -webkit-user-select: none;
    user-select: none;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    padding: 16px 12px 32px;
    touch-action: manipulation;
  }

  /* ---- top bar ---- */
  #topbar {
    width: 100%;
    max-width: 520px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  #topbar .left { color: var(--accent); }
  #topbar .streak { color: var(--coin); }
  #restartBtn {
    font: inherit;
    font-size: 9px;
    padding: 7px 10px;
    background: transparent;
    color: var(--danger);
    border: 2px solid var(--danger);
    border-radius: 4px;
    cursor: pointer;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  #restartBtn:active { transform: translateY(1px); }

  /* ---- progress ---- */
  #progressWrap {
    width: 100%;
    max-width: 520px;
  }
  #progressMeta {
    display: flex;
    justify-content: space-between;
    font-size: 9px;
    opacity: 0.7;
    letter-spacing: 1px;
    margin-bottom: 6px;
    text-transform: uppercase;
  }
  #progressBar {
    height: 12px;
    background: var(--line);
    border: 2px solid #06070f;
    border-radius: 4px;
    overflow: hidden;
  }
  #progressFill {
    height: 100%;
    width: 0%;
    background: var(--accent);
    transition: width 0.25s ease;
    image-rendering: pixelated;
  }

  /* ---- card ---- */
  #card {
    width: 100%;
    max-width: 520px;
    background: var(--panel);
    border: 3px solid var(--line);
    border-radius: 8px;
    box-shadow: 0 0 0 4px #06070f, 0 12px 32px rgba(0,0,0,0.6);
    padding: 26px 20px;
    text-align: center;
    position: relative;
    overflow: hidden;
    min-height: 220px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 16px;
  }
  #prompt { font-size: 10px; opacity: 0.6; letter-spacing: 2px; text-transform: uppercase; }
  #word {
    font-size: 26px;
    line-height: 1.3;
    color: var(--fg);
    word-break: break-word;
  }
  #word .blank { color: var(--accent); }
  #translation { font-size: 11px; opacity: 0.75; line-height: 1.6; }

  #speakBtn {
    font: inherit;
    font-size: 14px;
    align-self: center;
    padding: 8px 14px;
    background: transparent;
    color: var(--coin);
    border: 2px solid var(--coin);
    border-radius: 4px;
    cursor: pointer;
    letter-spacing: 1px;
  }
  #speakBtn:active { transform: translateY(1px); }
  #speakBtn.speaking { background: var(--coin); color: #06121a; }
  #speakBtn[hidden] { display: none; }

  /* feedback / explain block (hidden until answered) */
  #explain {
    font-size: 10px;
    line-height: 1.8;
    border-top: 2px dashed var(--line);
    padding-top: 14px;
    margin-top: 2px;
    display: none;
    text-align: left;
  }
  #explain.show { display: block; }
  #explain .verdict { font-size: 13px; letter-spacing: 1px; margin-bottom: 10px; text-transform: uppercase; }
  #explain .verdict.right { color: var(--accent); }
  #explain .verdict.wrong { color: var(--danger); }
  #explain .row { margin: 8px 0; opacity: 0.92; }
  #explain .lbl { color: var(--coin); }
  #explain .de { color: var(--fg); }
  #explain .en { opacity: 0.6; }
  #explain .tip { color: var(--der); }

  /* ---- answer buttons ---- */
  #answers {
    width: 100%;
    max-width: 520px;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
  }
  .ansBtn {
    font: inherit;
    font-size: 16px;
    padding: 20px 6px;
    border: 3px solid;
    border-radius: 6px;
    cursor: pointer;
    letter-spacing: 1px;
    background: #0e1124;
    transition: transform 0.05s ease, background 0.1s ease;
  }
  .ansBtn[data-a="der"] { color: var(--der); border-color: var(--der); }
  .ansBtn[data-a="die"] { color: var(--die); border-color: var(--die); }
  .ansBtn[data-a="das"] { color: var(--das); border-color: var(--das); }
  .ansBtn:active { transform: translateY(2px); }
  .ansBtn[data-a="der"].fill { background: var(--der); color: #06121a; }
  .ansBtn[data-a="die"].fill { background: var(--die); color: #06121a; }
  .ansBtn[data-a="das"].fill { background: var(--das); color: #06121a; }
  .ansBtn.correct { background: var(--accent); color: #06121a; border-color: var(--accent); }
  .ansBtn.wrong { background: var(--danger); color: #fff; border-color: var(--danger); }
  .ansBtn:disabled { cursor: default; opacity: 0.85; }

  #nextBtn {
    font: inherit;
    font-size: 12px;
    padding: 14px 22px;
    background: var(--accent);
    color: #06121a;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    letter-spacing: 1px;
    text-transform: uppercase;
    display: none;
  }
  #nextBtn.show { display: inline-block; }
  #nextBtn:active { transform: translateY(1px); }

  #hint {
    font-size: 9px;
    opacity: 0.5;
    letter-spacing: 1px;
    text-align: center;
    max-width: 520px;
    line-height: 1.7;
  }

  /* ---- finish screen ---- */
  #finish {
    width: 100%;
    max-width: 520px;
    background: var(--panel);
    border: 3px solid var(--accent);
    border-radius: 8px;
    box-shadow: 0 0 0 4px #06070f;
    padding: 30px 22px;
    text-align: center;
    display: none;
    flex-direction: column;
    gap: 18px;
  }
  #finish.show { display: flex; }
  #finish h1 { font-size: 18px; color: var(--accent); letter-spacing: 2px; }
  #finish p { font-size: 11px; line-height: 1.9; }
  #finish b { color: var(--coin); }
  #finish button {
    font: inherit;
    font-size: 12px;
    padding: 14px 22px;
    background: var(--accent);
    color: #06121a;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .flash-right { animation: flashR 0.4s; }
  .flash-wrong { animation: flashW 0.4s; }
  @keyframes flashR { 0% { box-shadow: 0 0 0 4px #06070f, 0 0 0 0 var(--accent); } 50% { box-shadow: 0 0 0 4px #06070f, 0 0 24px 4px var(--accent); } 100% { box-shadow: 0 0 0 4px #06070f, 0 12px 32px rgba(0,0,0,0.6); } }
  @keyframes flashW { 0% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } 100% { transform: translateX(0); } }
</style>
</head>
<body>

  <div id="topbar">
    <div class="left">DER · DIE · DAS</div>
    <div class="streak" id="streak">🔥 0</div>
    <button id="restartBtn">↺ Restart</button>
  </div>

  <div id="progressWrap">
    <div id="progressMeta">
      <span id="posLabel">Word 1 / 150</span>
      <span id="accLabel">✓ 0 · ✗ 0</span>
    </div>
    <div id="progressBar"><div id="progressFill"></div></div>
  </div>

  <div id="card">
    <div id="prompt">Which article?</div>
    <div id="word">—</div>
    <div id="translation"></div>
    <button id="speakBtn" title="Hear it">🔊 Hören</button>

  <div id="answers">
    <button class="ansBtn" data-a="der">der</button>
    <button class="ansBtn" data-a="die">die</button>
    <button class="ansBtn" data-a="das">das</button>

  <button id="nextBtn">Next →</button>

  <div id="finish">
    <h1>Deck Complete! 🚀</h1>

    <button id="finishReview" hidden>Review my mistakes</button>

    { w:"Gemüse", a:"das", en:"vegetables", de:"Das Gemüse ist ganz frisch.", ex:"The vegetables are quite fresh.", tip:"Most Ge- collective nouns are das." },
    { w:"Gebäude", a:"das", en:"building", de:"Das Gebäude ist ziemlich hoch.", ex:"The building is quite tall.", tip:"Many Ge- nouns are das." },
    { w:"Rezept", a:"das", en:"recipe/prescription", de:"Das Rezept ist ganz einfach.", ex:"The recipe is very simple.", tip:"No rule — memorise it." },
    { w:"Ziel", a:"das", en:"goal/destination", de:"Das Ziel ist klar definiert.", ex:"The goal is clearly defined.", tip:"No rule — memorise it." },
    { w:"Messer", a:"das", en:"knife", de:"Das Messer ist sehr scharf.", ex:"The knife is very sharp.", tip:"-er, but this one is das — memorise it." },
    { w:"Telefon", a:"das", en:"telephone", de:"Das Telefon klingelt schon wieder.", ex:"The telephone is ringing again.", tip:"No rule — memorise it." },
    { w:"Handy", a:"das", en:"cell phone", de:"Das Handy ist ganz neu.", ex:"The cell phone is brand new.", tip:"No rule — memorise it." },

    { w:"Jahr", a:"das", en:"year", de:"Das Jahr war wirklich gut.", ex:"The year was really good.", tip:"No rule — memorise (plural: die Jahre)." },
    { w:"Wochenende", a:"das", en:"weekend", de:"Das Wochenende war sehr schön.", ex:"The weekend was very nice.", tip:"From das Ende — memorise it." },
    { w:"Wetter", a:"das", en:"weather", de:"Das Wetter ist heute schlecht.", ex:"The weather is bad today.", tip:"-er, but this one is das — memorise it." },

    { w:"Meer", a:"das", en:"sea", de:"Das Meer ist tiefblau.", ex:"The sea is deep blue.", tip:"das Meer = sea (compare der See = lake)." },
    { w:"Kino", a:"das", en:"cinema", de:"Das Kino ist heute voll.", ex:"The cinema is full today.", tip:"Most -o nouns are das." },

    { w:"Hotel", a:"das", en:"hotel", de:"Das Hotel ist modern und sauber.", ex:"The hotel is modern and clean.", tip:"No rule — memorise it." },
    { w:"Büro", a:"das", en:"office", de:"Das Büro ist hell und groß.", ex:"The office is bright and big.", tip:"Most -o nouns are das." },

    { w:"Gesicht", a:"das", en:"face", de:"Das Gesicht ist sehr freundlich.", ex:"The face is very friendly.", tip:"Many Ge- nouns are das." },
    { w:"Haar", a:"das", en:"hair", de:"Das Haar ist lang und glatt.", ex:"The hair is long and straight.", tip:"No rule — memorise it." },
    { w:"Mädchen", a:"das", en:"girl", de:"Das Mädchen lacht laut.", ex:"The girl laughs loudly.", tip:"All -chen diminutives are das (even for people!)." },
    { w:"Brötchen", a:"das", en:"bread roll", de:"Das Brötchen ist noch warm.", ex:"The bread roll is still warm.", tip:"All -chen diminutives are das." },
    { w:"Tier", a:"das", en:"animal", de:"Das Tier ist ziemlich groß.", ex:"The animal is quite big.", tip:"No rule — memorise it." },
    { w:"Pferd", a:"das", en:"horse", de:"Das Pferd ist sehr schnell.", ex:"The horse is very fast.", tip:"No rule — memorise it." },
    { w:"Foto", a:"das", en:"photo", de:"Das Foto ist wirklich schön.", ex:"The photo is really nice.", tip:"Most -o nouns are das." },
    { w:"Bild", a:"das", en:"picture", de:"Das Bild ist sehr alt.", ex:"The picture is very old.", tip:"No rule — memorise (plural: die Bilder)." },
    { w:"Wort", a:"das", en:"word", de:"Das Wort ist neu für mich.", ex:"The word is new to me.", tip:"No rule — memorise it." },
    { w:"Beispiel", a:"das", en:"example", de:"Das Beispiel ist sehr gut.", ex:"The example is very good.", tip:"No rule — memorise it." },
    { w:"Problem", a:"das", en:"problem", de:"Das Problem ist ziemlich groß.", ex:"The problem is quite big.", tip:"No rule — memorise it." },
    { w:"Spiel", a:"das", en:"game", de:"Das Spiel macht echt Spaß.", ex:"The game is really fun.", tip:"No rule — memorise it." },
    { w:"Geschenk", a:"das", en:"gift", de:"Das Geschenk ist sehr schön.", ex:"The gift is very nice.", tip:"Many Ge- nouns are das." },
    { w:"Papier", a:"das", en:"paper", de:"Das Papier ist ganz weiß.", ex:"The paper is completely white.", tip:"No rule — memorise it." },
    { w:"Heft", a:"das", en:"notebook", de:"Das Heft ist noch leer.", ex:"The notebook is still empty.", tip:"No rule — memorise it." },
    { w:"Essen", a:"das", en:"food/meal", de:"Das Essen ist sehr lecker.", ex:"The food is very tasty.", tip:"Verbs used as nouns (das Essen) are das." },
    { w:"Leben", a:"das", en:"life", de:"Das Leben ist schön.", ex:"Life is beautiful.", tip:"Verbs used as nouns (das Leben) are das." },
  ];

  const STORAGE_KEY = "astroboy_articles_v1";
  const N = WORDS.length;

  // ---------------------------------------------------------------------------
  // Shuffle helpers — produce an order where no two neighbours share an article
  // ---------------------------------------------------------------------------
  function fisherYates(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  // Greedy interleave: always take the article-bucket with the most cards left
  // that is different from the previously placed one. With balanced buckets this
  // guarantees der/die/das never appear twice in a row.
  function buildShuffledOrder(indices) {
    const pool = indices || WORDS.map((_, i) => i);
    const buckets = { der: [], die: [], das: [] };
    pool.forEach(idx => buckets[WORDS[idx].a].push(idx));
    fisherYates(buckets.der);
    fisherYates(buckets.die);
    fisherYates(buckets.das);

    const order = [];
    let last = null;
    while (buckets.der.length + buckets.die.length + buckets.das.length > 0) {
      // candidate buckets that aren't the last article and aren't empty
      let candidates = ["der", "die", "das"]
        .filter(k => k !== last && buckets[k].length > 0);
      // fallback: if only the last-article bucket remains, we must use it
      if (candidates.length === 0) {
        candidates = ["der", "die", "das"].filter(k => buckets[k].length > 0);
      }
      // pick the fullest candidate bucket to keep counts balanced
      candidates.sort((a, b) => buckets[b].length - buckets[a].length);
      const pick = candidates[0];
      order.push(buckets[pick].pop());
      last = pick;
    }
    return order;
  }

  // ---------------------------------------------------------------------------
  // Persistence
  // ---------------------------------------------------------------------------
  function loadSession() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      const s = JSON.parse(raw);
      if (!Array.isArray(s.order)) return null;
      if (!s.isReview && s.order.length !== N) return null; // word bank changed
      if (!Array.isArray(s.mistakes)) s.mistakes = [];
      return s;
    } catch (e) { return null; }
  }
  function saveSession() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(session)); } catch (e) {}
  }
  function newSession(indices, isReview) {
    return {
      order: buildShuffledOrder(indices),
      pos: 0, correct: 0, wrong: 0, streak: 0, bestStreak: 0,
      mistakes: [], isReview: !!isReview,
    };
  }

  let session = loadSession() || newSession();
  saveSession();

  // ---------------------------------------------------------------------------
  // DOM
  // ---------------------------------------------------------------------------
  const el = {
    word: document.getElementById("word"),
    translation: document.getElementById("translation"),
    explain: document.getElementById("explain"),
    streak: document.getElementById("streak"),
    posLabel: document.getElementById("posLabel"),
    accLabel: document.getElementById("accLabel"),
    fill: document.getElementById("progressFill"),
    card: document.getElementById("card"),
    answers: document.getElementById("answers"),
    next: document.getElementById("nextBtn"),
    finish: document.getElementById("finish"),
    finishStats: document.getElementById("finishStats"),
    speak: document.getElementById("speakBtn"),
    review: document.getElementById("finishReview"),
  };
  const ansBtns = Array.from(document.querySelectorAll(".ansBtn"));

  let answered = false;

  // ---- Speech (browser-native, offline, no library) -------------------------
  const canSpeak = "speechSynthesis" in window;
  if (!canSpeak) el.speak.hidden = true;
  function speak(text) {
    if (!canSpeak) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "de-DE";
    u.rate = 0.85;
    const de = speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith("de"));
    if (de) u.voice = de;
    el.speak.classList.add("speaking");
    u.onend = u.onerror = () => el.speak.classList.remove("speaking");
    speechSynthesis.speak(u);
  }
  // Before answering, say only the noun (no article spoiler); after, the full phrase.
  function speakCurrent() {
    const word = currentWord();
    speak(answered ? `${word.a} ${word.w}` : word.w);
  }

  function currentWord() {
    return WORDS[session.order[session.pos]];
  }

  function renderProgress() {
    const deckLen = session.order.length;
    const label = session.isReview ? "Review" : "Word";
    el.posLabel.textContent = `${label} ${Math.min(session.pos + 1, deckLen)} / ${deckLen}`;
    el.accLabel.textContent = `✓ ${session.correct} · ✗ ${session.wrong}`;
    el.streak.textContent = `🔥 ${session.streak}`;
    el.fill.style.width = `${(session.pos / deckLen) * 100}%`;
  }

  function renderCard() {
    answered = false;
    const word = currentWord();
    el.word.innerHTML = `<span class="blank">___</span> ${word.w}`;
    el.translation.textContent = `(${word.en})`;
    el.explain.className = "";
    el.explain.innerHTML = "";
    el.next.className = "";
    el.speak.classList.remove("speaking");
    el.speak.textContent = "🔊 Hören";
    ansBtns.forEach(b => {
      b.disabled = false;
      b.className = "ansBtn";
    });
    renderProgress();
  }

  function answer(choice) {
    if (answered) return;
    answered = true;
    const word = currentWord();
    const wordIdx = session.order[session.pos];
    const right = choice === word.a;

    ansBtns.forEach(b => {
      b.disabled = true;
      if (b.dataset.a === word.a) b.classList.add("correct");
      else if (b.dataset.a === choice) b.classList.add("wrong");
    });

    if (right) {
      session.correct++;
      session.streak++;
      session.bestStreak = Math.max(session.bestStreak, session.streak);
      el.card.classList.add("flash-right");
    } else {
      session.wrong++;
      session.streak = 0;
      if (!session.mistakes.includes(wordIdx)) session.mistakes.push(wordIdx);
      el.card.classList.add("flash-wrong");
    }
    setTimeout(() => el.card.classList.remove("flash-right", "flash-wrong"), 420);

    el.speak.textContent = "🔊 " + word.a + " " + word.w;

    const verdict = right
      ? `<div class="verdict right">✓ Richtig!</div>`
      : `<div class="verdict wrong">✗ It's «${word.a} ${word.w}»</div>`;

    el.explain.innerHTML = `
      ${verdict}
      <div class="row"><span class="de">${word.de}</span></div>
      <div class="row en">${word.ex}</div>
      <div class="row"><span class="lbl">💡 Tip:</span> <span class="tip">${word.tip}</span></div>
    `;
    el.explain.classList.add("show");
    el.next.classList.add("show");
    el.next.textContent = session.pos + 1 >= session.order.length ? "See results →" : "Next →";

    renderProgress();
    saveSession();
  }

  function next() {
    if (!answered) return;
    session.pos++;
    saveSession();
    if (session.pos >= session.order.length) {
      showFinish();
    } else {
      renderCard();
    }
  }

  function showFinish() {
    el.card.style.display = "none";
    el.answers.style.display = "none";
    el.next.classList.remove("show");
    document.getElementById("progressWrap").style.display = "none";
    el.fill.style.width = "100%";
    const total = session.correct + session.wrong;
    const pct = total ? Math.round((session.correct / total) * 100) : 0;
    const missed = session.mistakes.length;
    el.finishStats.innerHTML =
      `${session.isReview ? "Review round — " : ""}you answered <b>${session.correct}/${total}</b> correctly (<b>${pct}%</b>).<br/>` +
      `Best streak: <b>🔥 ${session.bestStreak}</b><br/><br/>` +
      (missed === 0 ? "Flawless — not a single miss! 🌟" :
       pct >= 70 ? `Solid work! You missed <b>${missed}</b> word${missed > 1 ? "s" : ""} — review them to lock it in. 💪` :
                   `Good effort — <b>${missed}</b> word${missed > 1 ? "s" : ""} to review, then run it again! 🚀`);

    if (missed > 0) {
      el.review.hidden = false;
      el.review.textContent = `Review my ${missed} mistake${missed > 1 ? "s" : ""}`;
    } else {
      el.review.hidden = true;
    }
    el.finish.classList.add("show");
  }

  function showDeck() {
    el.card.style.display = "";
    el.answers.style.display = "";
    document.getElementById("progressWrap").style.display = "";
    el.finish.classList.remove("show");
    renderCard();
  }

  function restart(confirmFirst) {
    if (confirmFirst && !confirm("Restart from the beginning with a fresh shuffle? Your current progress will be lost.")) return;
    session = newSession();
    saveSession();
    showDeck();
  }

  function reviewMistakes() {
    if (!session.mistakes.length) return;
    session = newSession(session.mistakes.slice(), true);
    saveSession();
    showDeck();
  }

  // ---------------------------------------------------------------------------
  // Events
  // ---------------------------------------------------------------------------
  ansBtns.forEach(b => b.addEventListener("click", () => answer(b.dataset.a)));
  el.next.addEventListener("click", next);
  document.getElementById("restartBtn").addEventListener("click", () => restart(true));
  document.getElementById("finishRestart").addEventListener("click", () => restart(false));
  el.review.addEventListener("click", reviewMistakes);
  el.speak.addEventListener("click", speakCurrent);

  addEventListener("keydown", (e) => {
    if (e.key === "1") answer("der");
    else if (e.key === "2") answer("die");
    else if (e.key === "3") answer("das");
    else if (e.key === "Enter" || e.key === " ") { if (answered) { e.preventDefault(); next(); } }
  });

  // ---------------------------------------------------------------------------
  // Boot — resume where the user left off (or finish screen if deck was done)
  // ---------------------------------------------------------------------------
  if (session.pos >= session.order.length) showFinish();
  else renderCard();
})();
</script>

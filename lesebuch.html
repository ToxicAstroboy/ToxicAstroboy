<p>Der Zug nach Waldbach fährt langsam. Draußen ziehen die dunklen <v en="fir trees">Tannen</v> des <v en="Black Forest">Schwarzwaldes</v> vorbei, und der <v en="fog">Nebel</v> liegt schwer über den <v en="hills">Hügeln</v>. Ich heiße Lena, bin zweiundzwanzig Jahre alt und studiere in Berlin <v en="art history">Kunstgeschichte</v>. Aber heute bin ich weit weg von der Stadt.</p>

<p class="dialog">„Also gut", sage ich leise zu mir selbst. „Fangen wir an."</p>

<p>Ich stelle den Koffer ab, ziehe die Jacke aus und mache das Licht an. Zwei der Lampen funktionieren nicht mehr. Im Wohnzimmer hängt ein altes Foto: Meine Großmutter als junge Frau, neben einem Mann, den ich nicht kenne. Sie lacht. Der Mann schaut <v en="serious">ernst</v>.</p>

<p>Ich stelle das Foto zurück auf das <v en="shelf">Regal</v>, aber irgendetwas in mir hat sich schon <v en="changed">verändert</v>. Vielleicht weiß ich noch nicht, dass diese Woche mein Leben ein wenig anders machen wird.</p>

<p>Am nächsten Morgen wache ich früh auf. Durch das kleine <v en="bedroom">Schlafzimmer</v>fenster fällt ein <v en="pale">blasses</v> Licht. Draußen schneit es leicht. Ich habe schlecht geschlafen; das Bett ist weich, aber das Haus macht <v en="noises">Geräusche</v>, die ich nicht kenne — das <v en="creaking">Knacken</v> der <v en="beams">Balken</v>, der Wind, der gegen die Fensterläden schlägt.</p>

<p>Von hier aus kann ich das ganze Zimmer sehen. Bücher, überall Bücher. Meine Großmutter war Lehrerin, bevor sie in <v en="retirement">Rente</v> gegangen ist. Sie hat mir früher gesagt, dass ein Haus ohne Bücher wie ein Winter ohne Schnee ist. Damals habe ich das nicht ganz verstanden.</p>

<p>Ungefähr in der Mitte des Buches spüre ich etwas Hartes zwischen den Seiten. Ich schlage das Buch auf — und dort liegt er.</p>

<p>Er ist klein, aus <v en="brass">Messing</v>, und sieht aus wie der Schlüssel für eine alte <v en="chest">Truhe</v> oder eine <v en="small box">Schatulle</v>. An seinem Ring hängt ein winziges Stück Papier. Ich <v en="unfold">falte</v> es auf, so vorsichtig ich kann, damit es nicht <v en="breaks">zerbricht</v>.</p>

<p>Auf dem Papier steht in schöner, alter Handschrift:</p>

<p><em>Für Hilde. Wenn ich nicht zurückkomme, weißt du, wo du suchen musst. — J.</em></p>

<p>Ich lese den Satz noch einmal. Und noch einmal. Mein Herz schlägt schneller. J. — das kann nur Josef sein. Der Mann auf dem Foto, den meine Großmutter nie <v en="mentioned">erwähnt</v> hat.</p>

<p>Ich lege den Schlüssel vorsichtig in meine <v en="palm">Handfläche</v>. Er ist kalt, aber irgendwie fühlt es sich an, als würde er leise leben.</p>

<p class="dialog">„Wo soll ich suchen?", frage ich das leere Zimmer.</p>

  {

<p>Ich schlafe fast gar nicht. Der kleine Messingschlüssel liegt auf dem <v en="nightstand">Nachttisch</v>, und immer wieder greife ich danach, um sicher zu sein, dass er wirklich <v en="exists">existiert</v>. Um vier Uhr morgens gebe ich auf, stehe auf und mache mir wieder Kaffee.</p>

<p>Ich versuche, die Schublade mit einem Messer zu öffnen — vorsichtig, damit ich nichts kaputt mache. Nach einigen Minuten <v en="gives way">gibt</v> das Schloss <v en="gives way">nach</v>. In der Schublade liegen mehrere alte Briefe, mit einem roten <v en="ribbon">Band</v> zusammengebunden. Der oberste Brief trägt das Datum <em>14. August 1962</em>.</p>

const STORAGE_KEY = "lesebuch_ch_v1";

const chaptersNav = document.getElementById("chapters");
const reader = document.getElementById("reader");
const bar = document.getElementById("barFill");
const curCh = document.getElementById("curCh");
const totCh = document.getElementById("totCh");
const prevBtn = document.getElementById("prev");
const nextBtn = document.getElementById("next");
const toggleTr = document.getElementById("toggleTr");
const tip = document.getElementById("tip");

let current = 0;
let showAll = false;

// Convert <v en="...">word</v> markup into <span class="v" data-en="...">word</span>
function processVocab(html) {
  return html.replace(/<v en="([^"]+)">([\s\S]*?)<\/v>/g, (_, en, word) =>
    `<span class="v" data-en="${en.replace(/"/g, "&quot;")}">${word}</span>`
  );
}

function renderChapters() {
  chaptersNav.innerHTML = "";
  CHAPTERS.forEach((ch, i) => {
    const b = document.createElement("button");
    b.className = "chip" + (i === current ? " active" : "");
    b.textContent = (i + 1) + "";
    b.title = ch.title;
    b.addEventListener("click", () => go(i));
    chaptersNav.appendChild(b);
  });
  totCh.textContent = CHAPTERS.length;
}

function render() {
  const ch = CHAPTERS[current];
  reader.innerHTML =
    `<span class="kap">${ch.number}</span>
     <h2>${ch.title}</h2>
     ${processVocab(ch.body)}`;
  reader.classList.toggle("showAll", showAll);
  curCh.textContent = current + 1;
  bar.style.width = ((current + 1) / CHAPTERS.length * 100) + "%";
  Array.from(chaptersNav.children).forEach((c, i) =>
    c.classList.toggle("active", i === current)
  );
  prevBtn.disabled = current === 0;
  nextBtn.disabled = current === CHAPTERS.length - 1;
  window.scrollTo({ top: 0, behavior: "smooth" });
  try { localStorage.setItem(STORAGE_KEY, String(current)); } catch (_) {}
  hideTip();
}

function go(i) {
  if (i < 0 || i >= CHAPTERS.length) return;
  current = i;
  render();
}

prevBtn.addEventListener("click", () => go(current - 1));
nextBtn.addEventListener("click", () => go(current + 1));
toggleTr.addEventListener("click", () => {
  showAll = !showAll;
  toggleTr.classList.toggle("on", showAll);
  toggleTr.textContent = showAll ? "EN aus" : "EN alle";
  reader.classList.toggle("showAll", showAll);
  hideTip();
});

// Vocabulary tooltip
let openEl = null;
function hideTip() {
  tip.style.display = "none";
  if (openEl) { openEl.classList.remove("open"); openEl = null; }
}
function showTip(el) {
  if (openEl && openEl !== el) openEl.classList.remove("open");
  openEl = el;
  el.classList.add("open");
  tip.textContent = el.getAttribute("data-en");
  tip.style.display = "block";
  const r = el.getBoundingClientRect();
  const tR = tip.getBoundingClientRect();
  let left = r.left + window.scrollX + r.width / 2;
  const half = tR.width / 2;
  const margin = 8;
  if (left - half < margin) left = half + margin;
  const maxRight = window.scrollX + document.documentElement.clientWidth - margin;
  if (left + half > maxRight) left = maxRight - half;
  tip.style.left = left + "px";
  tip.style.top = (r.top + window.scrollY - 8) + "px";
}

reader.addEventListener("click", (e) => {
  const v = e.target.closest(".v");
  if (v) {
    e.stopPropagation();
    if (openEl === v) { hideTip(); return; }
    showTip(v);
  } else {
    hideTip();
  }
});
document.addEventListener("click", (e) => {
  if (!e.target.closest("#reader") && !e.target.closest("#tip")) hideTip();
});
window.addEventListener("scroll", hideTip, { passive: true });
window.addEventListener("resize", hideTip);

document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight") go(current + 1);
  else if (e.key === "ArrowLeft") go(current - 1);
  else if (e.key === "Escape") hideTip();
});

// Init
try {
  const saved = parseInt(localStorage.getItem(STORAGE_KEY) || "0", 10);
  if (!isNaN(saved) && saved >= 0 && saved < CHAPTERS.length) current = saved;
} catch (_) {}
renderChapters();
render();
</script>
</body>
</html>
